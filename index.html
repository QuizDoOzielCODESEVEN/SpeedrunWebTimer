<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speedrun Timer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <h1>⏱ Speedrun Timer</h1>

    <div id="search-section">
      <input id="game-input" type="text" placeholder="Game Name..." />
      <button onclick="searchGame()">Search</button>
      <button id="btn-neutral" onclick="neutralGame()" title="Jogo sem run no Speedrun.com">🎮 Neutral</button>
      <div id="game-results"></div>
    </div>

    <div id="category-section" class="hidden">
      <label>Category:</label>
      <select id="category-select" onchange="loadSplits()"></select>
    </div>

    <div id="timer-section" class="hidden">
      <div id="timer-display">0:00.000</div>
      <div id="controls">
        <button id="btn-start" onclick="startTimer()">Start</button>
        <button id="btn-split" onclick="doSplit()" disabled>Split</button>
        <button id="btn-reset" onclick="resetTimer()">Reset</button>
      </div>
      <div id="split-actions">
        <button onclick="openEditor()">✏️ Edit Splits</button>
        <button onclick="saveSplitsFile()">💾 Save</button>
        <label class="btn-file">📂 Load <input type="file" accept=".json" onchange="loadSplitsFile(event)" /></label>
      </div>
      <div id="splits-container">
        <table id="splits-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Split</th>
              <th>Tempo</th>
              <th>Delta</th>
            </tr>
          </thead>
          <tbody id="splits-body"></tbody>
        </table>
      </div>
      <div id="pb-section">
        <span>PB: <span id="pb-display">--</span></span>
      </div>
    </div>
  </div>

  <!-- Editor Modal -->
  <div id="editor-modal" class="modal hidden">
    <div class="modal-box">
      <h2>✏️ Edit Splits</h2>
      <div id="editor-list"></div>
      <div class="editor-footer">
        <button onclick="editorAddSplit()">+ Adicionar</button>
        <button onclick="applyEditor()">✅ Apply</button>
        <button class="btn-cancel" onclick="closeEditor()">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
